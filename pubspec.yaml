name: bloom
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  cloud_firestore: ^6.2.0
  cloud_functions: ^6.1.0
  firebase_app_check: ^0.4.2
  firebase_auth: ^6.3.0
  firebase_core: ^4.6.0
  firebase_storage: ^13.2.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.4.0
  flutter_riverpod: ^3.3.1
  flutter_svg: ^2.2.4
  go_router: ^17.2.0
  image_cropper: ^12.2.0
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/icons/nav/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
