name: bloom
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  # --- FIREBASE PACKAGES ---
  cloud_firestore: ^6.3.0
  cloud_functions: ^6.2.0
  firebase_app_check: ^0.4.3
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  firebase_storage: ^13.3.0
  # ---------------------------------
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.4.0
  flutter_riverpod: ^3.3.1
  flutter_svg: ^2.2.4
  go_router: ^17.2.0
  intl: ^0.19.0
  image_cropper: ^12.2.0
  image_picker: ^1.2.1
  palette_generator: ^0.3.3+7 # Members take note: This package has been discontinued. (Commented on 2026-05-09) Consider using an alternative package for color palette generation in the future.
  readmore: ^3.0.0
  url_launcher: ^6.3.2
  flutter_dotenv: ^6.0.1
  geolocator: ^14.0.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  dart_geohash: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/icons/nav/
    - assets/icons/profile/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"